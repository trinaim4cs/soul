<div
  style="
    font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: #0a0a0a;
    max-width: 440px;
    margin: 0 auto;
    padding: 32px 24px;
  ">
  <p style="font-size: 13px; letter-spacing: 0.08em; color: #5c5c5c; margin: 0 0 24px">
    SOUL · ONLY FOR SRM
  </p>
  <p style="font-size: 17px; line-height: 1.5; margin: 0 0 16px">Your SOUL sign-in code:</p>
  <p style="font-size: 36px; letter-spacing: 0.3em; font-weight: 600; margin: 0 0 24px">
    {{ .Token }}
  </p>
  <p style="font-size: 15px; line-height: 1.5; color: #5c5c5c; margin: 0">
    It expires in 10 minutes. If you did not try to sign in to SOUL, you can ignore this email. SOUL
    will never ask you for this code.
  </p>
</div>
