# SOUL continuous checks (Phase 16, TESTING.md): the same steps as `npm run test:all`.
# No secrets are used: the database job runs a throwaway local Supabase stack with the mock
# payment provider and freshly generated Web Push keys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, format, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --cache ~/.npm
      # Generated by Expo on first start; typecheck needs it.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx jest --ci

  functions:
    name: Edge Functions (Deno type check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run functions:check
        env:
          DENO_DIR: ${{ runner.temp }}/deno

  database:
    name: Database (pgTAP and HTTP checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --cache ~/.npm
      - name: Local Edge Function settings (test values only)
        run: |
          node -e "
          const c = require('crypto');
          const k = c.generateKeyPairSync('ec', { namedCurve: 'prime256v1' }).privateKey.export({ format: 'jwk' });
          const pub = Buffer.concat([Buffer.from([4]), Buffer.from(k.x, 'base64url'), Buffer.from(k.y, 'base64url')]).toString('base64url');
          const lines = [
            'SOUL_ENV=development',
            'PAYMENTS_PROVIDER=mock',
            'PAYMENTS_SITE_URL=http://localhost:8081',
            'RAZORPAY_WEBHOOK_SECRET=' + c.randomBytes(24).toString('hex'),
            'VAPID_PUBLIC_KEY=' + pub,
            'VAPID_PRIVATE_KEY=' + k.d,
            'VAPID_SUBJECT=mailto:ci@example.invalid',
          ];
          require('fs').writeFileSync('supabase/functions/.env', lines.join('\n') + '\n');
          "
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:verify
      - if: always()
        run: npm run db:stop
